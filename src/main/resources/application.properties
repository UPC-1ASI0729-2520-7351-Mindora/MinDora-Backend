spring.application.name=mindora-backend

server.port=${PORT:8080}

# Database Configuration (Railway will override with environment variables)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/mindora-bd?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:joao}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger

# JWT Configuration
jwt.secret=mindora_secret_key_very_secure_and_long_at_least_256_bits_for_hs256_algorithm
jwt.expiration=86400000

spring.config.import=optional:application-local.properties
